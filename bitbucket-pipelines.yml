# Builds the Docker image and pushes it to the registry configured in the
# repository variables: DOCKER_REGISTRY (host), DOCKER_PROJECT (namespace),
# DOCKER_USER and DOCKER_PASSWORD (secured).
image: atlassian/default-image:3

pipelines:
  default:
    - step:
        name: Build and Push
        runs-on:
          - self.hosted
          - linux
        script:
          - echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USER}" --password-stdin "${DOCKER_REGISTRY}"
          - IMAGE="${DOCKER_REGISTRY}/${DOCKER_PROJECT}/${BITBUCKET_REPO_SLUG}"
          - VERSION="build-${BITBUCKET_BUILD_NUMBER}"
          - docker build . --file Dockerfile --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:latest"
          - docker push "${IMAGE}:${VERSION}"
          - docker push "${IMAGE}:latest"
        services:
          - docker
        caches:
          - docker

definitions:
  services:
    docker:
      memory: 3072
